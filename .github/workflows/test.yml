name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  unit-contract-integration:
    name: Unit, Contract & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run unit tests with coverage
        run: pnpm test:unit --coverage

      - name: Run contract tests
        run: pnpm test:contracts

      - name: Run integration tests
        run: pnpm test:integration

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # Combined job: Security + E2E tests (shares Supabase Docker images - ~700MB pull only once)
  security-and-e2e:
    name: Security & E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-contract-integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Apply migrations and seed data
        run: supabase db reset --debug

      - name: Get Supabase credentials
        id: supabase
        run: |
          echo "SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')" >> $GITHUB_OUTPUT
          echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT
          echo "SUPABASE_SERVICE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_OUTPUT

      # --- Security/RLS Tests ---
      - name: Run security tests
        run: pnpm test:security
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.SUPABASE_SERVICE_KEY }}

      # --- E2E Tests ---
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create test users in database
        run: |
          # Create test users via Supabase Auth API
          curl -X POST '${{ steps.supabase.outputs.SUPABASE_URL }}/auth/v1/admin/users' \
            -H 'apikey: ${{ steps.supabase.outputs.SUPABASE_SERVICE_KEY }}' \
            -H 'Authorization: Bearer ${{ steps.supabase.outputs.SUPABASE_SERVICE_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{"email": "test@example.com", "password": "testpassword123", "email_confirm": true}' || true
          
          curl -X POST '${{ steps.supabase.outputs.SUPABASE_URL }}/auth/v1/admin/users' \
            -H 'apikey: ${{ steps.supabase.outputs.SUPABASE_SERVICE_KEY }}' \
            -H 'Authorization: Bearer ${{ steps.supabase.outputs.SUPABASE_SERVICE_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{"email": "playerb@example.com", "password": "testpassword123", "email_confirm": true}' || true

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.SUPABASE_ANON_KEY }}

      - name: Start application server
        run: pnpm start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.SUPABASE_ANON_KEY }}

      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Server is ready"

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          TEST_USER_EMAIL: test@example.com
          TEST_USER_PASSWORD: testpassword123
          TEST_PLAYER_B_EMAIL: playerb@example.com
          TEST_PLAYER_B_PASSWORD: testpassword123

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/e2e/test-results/
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: supabase stop

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [unit-contract-integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:unit -- --coverage

      - name: Check coverage thresholds
        run: |
          echo "Coverage thresholds are enforced in vitest.config.ts"
          echo "If tests pass, coverage thresholds are met:"
          echo "  - Statements: 1%"
          echo "  - Branches: 1%"
          echo "  - Functions: 1%"
          echo "  - Lines: 1%"
